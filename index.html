<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS:S Bot Match Rank</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
            user-select: none;
        }
        .rank-card {
            background: linear-gradient(145deg, #1f2833, #12181f);
            border: 2px solid #66fcf1;
            border-radius: 12px;
            padding: 25px;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
        }
        h2 { color: #66fcf1; margin-top: 0; letter-spacing: 1px; }
        .rank-title { font-size: 24px; font-weight: bold; color: #45a29e; margin: 15px 0; }
        .wins { font-size: 16px; color: #c5c6c7; }
        .btn {
            background: #66fcf1; border: none; color: #0b0c10;
            padding: 10px 18px; margin-top: 15px; font-weight: bold;
            border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #45a29e; color: #fff; }
    </style>
</head>
<body>

<div class="rank-card">
    <h2>BOT MATCH RANKING</h2>
    <div class="rank-title" id="rankDisplay">Silver I</div>
    <div class="wins">Total Wins: <span id="winCount">0</span></div>
    <button class="btn" onclick="addWin()">+ Record Win</button>
</div>

<script>
    let wins = parseInt(localStorage.getItem('online_bot_wins')) || 0;

    function getRank(w) {
        if (w >= 50) return "Global Elite";
        if (w >= 30) return "Master Guardian";
        if (w >= 15) return "Gold Nova";
        if (w >= 5)  return "Silver Elite";
        return "Silver I";
    }

    function updateUI() {
        document.getElementById('winCount').innerText = wins;
        document.getElementById('rankDisplay').innerText = getRank(wins);
        localStorage.setItem('online_bot_wins', wins);
    }

    function addWin() {
        wins++;
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
